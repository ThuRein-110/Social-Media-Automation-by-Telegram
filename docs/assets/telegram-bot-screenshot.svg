<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Telegram bot control screenshot</title>
  <desc id="desc">Clean mock screenshot showing a Telegram bot conversation for creating and receiving a social video package.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#17212b"/>
      <stop offset="1" stop-color="#0f1720"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1200" height="720" fill="#e7edf3"/>
  <rect x="80" y="50" width="1040" height="620" rx="28" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="80" y="50" width="1040" height="82" rx="28" fill="#2aabee"/>
  <rect x="80" y="104" width="1040" height="28" fill="#2aabee"/>
  <circle cx="132" cy="91" r="24" fill="#d8f3ff"/>
  <text x="174" y="85" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="#ffffff">Social Agent Bot</text>
  <text x="174" y="112" font-family="Inter, Arial, sans-serif" font-size="15" fill="#d8f3ff">online - ready to create videos</text>
  <rect x="128" y="168" width="390" height="58" rx="18" fill="#eef5fb"/>
  <text x="152" y="204" font-family="Inter, Arial, sans-serif" font-size="20" fill="#152033">/start</text>
  <rect x="664" y="250" width="390" height="78" rx="18" fill="#d8f8d1"/>
  <text x="688" y="283" font-family="Inter, Arial, sans-serif" font-size="20" fill="#102015">today is reading vlog</text>
  <text x="973" y="308" font-family="Inter, Arial, sans-serif" font-size="13" fill="#4b7550">sent</text>
  <rect x="128" y="356" width="520" height="142" rx="20" fill="#eef5fb"/>
  <text x="152" y="394" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#152033">Creating your video package</text>
  <text x="152" y="428" font-family="Inter, Arial, sans-serif" font-size="17" fill="#40566c">- Writing short-form script</text>
  <text x="152" y="458" font-family="Inter, Arial, sans-serif" font-size="17" fill="#40566c">- Generating voice-over and subtitles</text>
  <text x="152" y="488" font-family="Inter, Arial, sans-serif" font-size="17" fill="#40566c">- Rendering vertical Reel export</text>
  <rect x="128" y="528" width="590" height="96" rx="20" fill="#eef5fb"/>
  <text x="152" y="564" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#152033">Manual upload package ready</text>
  <text x="152" y="596" font-family="Inter, Arial, sans-serif" font-size="17" fill="#40566c">Video attached below. Caption and hashtags sent separately.</text>
  <rect x="760" y="520" width="250" height="104" rx="16" fill="#101820"/>
  <rect x="790" y="546" width="190" height="52" rx="10" fill="#2aabee"/>
  <polygon points="858,556 858,588 888,572" fill="#ffffff"/>
</svg>
