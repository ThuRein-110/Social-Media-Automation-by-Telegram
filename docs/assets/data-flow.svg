<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc">
  <title id="title">Social video automation data flow</title>
  <desc id="desc">A clean architecture diagram showing Telegram topic input flowing through creative direction, voice, visuals, rendering, quality review, exports, and Telegram delivery.</desc>
  <defs>
    <linearGradient id="card" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f7fbff"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2563eb"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1400" height="780" fill="#f3f6fb"/>
  <text x="80" y="72" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800" fill="#0f172a">Automation Data Flow</text>
  <text x="80" y="108" font-family="Inter, Arial, sans-serif" font-size="18" fill="#526174">From Telegram topic to ready-to-upload social video package.</text>
  <g font-family="Inter, Arial, sans-serif">
    <g filter="url(#soft)">
      <rect x="80" y="165" width="230" height="110" rx="18" fill="url(#card)" stroke="#d7e1ef"/>
      <text x="110" y="210" font-size="18" font-weight="700" fill="#0f172a">Telegram Topic</text>
      <text x="110" y="240" font-size="15" fill="#526174">today is reading vlog</text>
    </g>
    <g filter="url(#soft)">
      <rect x="390" y="165" width="230" height="110" rx="18" fill="url(#card)" stroke="#d7e1ef"/>
      <text x="420" y="210" font-size="18" font-weight="700" fill="#0f172a">Creative Director</text>
      <text x="420" y="240" font-size="15" fill="#526174">Profile, story, script</text>
    </g>
    <g filter="url(#soft)">
      <rect x="700" y="165" width="230" height="110" rx="18" fill="url(#card)" stroke="#d7e1ef"/>
      <text x="730" y="210" font-size="18" font-weight="700" fill="#0f172a">Voice + Subtitles</text>
      <text x="730" y="240" font-size="15" fill="#526174">Measured timing</text>
    </g>
    <g filter="url(#soft)">
      <rect x="1010" y="165" width="230" height="110" rx="18" fill="url(#card)" stroke="#d7e1ef"/>
      <text x="1040" y="210" font-size="18" font-weight="700" fill="#0f172a">Visual Engine</text>
      <text x="1040" y="240" font-size="15" fill="#526174">Rights-safe media</text>
    </g>
    <g filter="url(#soft)">
      <rect x="235" y="390" width="230" height="110" rx="18" fill="url(#card)" stroke="#d7e1ef"/>
      <text x="265" y="435" font-size="18" font-weight="700" fill="#0f172a">Timeline</text>
      <text x="265" y="465" font-size="15" fill="#526174">Narration-aware cuts</text>
    </g>
    <g filter="url(#soft)">
      <rect x="545" y="390" width="230" height="110" rx="18" fill="url(#card)" stroke="#d7e1ef"/>
      <text x="575" y="435" font-size="18" font-weight="700" fill="#0f172a">FFmpeg Render</text>
      <text x="575" y="465" font-size="15" fill="#526174">1080x1920 MP4</text>
    </g>
    <g filter="url(#soft)">
      <rect x="855" y="390" width="230" height="110" rx="18" fill="url(#card)" stroke="#d7e1ef"/>
      <text x="885" y="435" font-size="18" font-weight="700" fill="#0f172a">Quality Review</text>
      <text x="885" y="465" font-size="15" fill="#526174">Frames, rights, audio</text>
    </g>
    <g filter="url(#soft)">
      <rect x="390" y="615" width="230" height="110" rx="18" fill="url(#card)" stroke="#d7e1ef"/>
      <text x="420" y="660" font-size="18" font-weight="700" fill="#0f172a">Platform Exports</text>
      <text x="420" y="690" font-size="15" fill="#526174">Reels, TikTok, Shorts</text>
    </g>
    <g filter="url(#soft)">
      <rect x="700" y="615" width="230" height="110" rx="18" fill="url(#card)" stroke="#d7e1ef"/>
      <text x="730" y="660" font-size="18" font-weight="700" fill="#0f172a">Telegram Delivery</text>
      <text x="730" y="690" font-size="15" fill="#526174">Video + captions</text>
    </g>
  </g>
  <g fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)">
    <path d="M310 220 H382"/>
    <path d="M620 220 H692"/>
    <path d="M930 220 H1002"/>
    <path d="M1125 275 C1125 335 350 330 350 382"/>
    <path d="M465 445 H537"/>
    <path d="M775 445 H847"/>
    <path d="M970 500 C970 570 505 555 505 607"/>
    <path d="M620 670 H692"/>
  </g>
</svg>
